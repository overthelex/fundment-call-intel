    - "The failed call (Trafford) contrasts: the rep got facts wrong (14 practices, actually 11), asked no questions for three minutes, and led with price"
  evidence:
    - "CALL-018 [07:47] / [09:55] week of the sixth / [08:15] Priya Menon / [03:51] / [09:02]"
