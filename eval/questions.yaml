    - "CALL-020 [06:11] / [07:21] / [06:36] mid-October / [03:39] no connector advantage"
    - "CALL-016 [01:54]-[02:12] one email in February"
    - "CALL-019 [00:34]-[00:44] fourteen vs eleven / [02:59] no questions / [04:27] won't read it"
  should_abstain: false
  notes: "Cold-call-only question. Ambiguity: whether Quarry Ridge's 'one email in February' counts as a follow-up. A good answer says it is a weak or deferred one. Kestrel's follow-up is conditional and likely to lose to Tray, so 'successful' should be hedged there."

