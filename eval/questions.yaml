    - "Zapier: Acme's price anchor; Cedar & Finch (60+ Zaps) and Fable Media (~20 Zaps) treat it as the alternative; Lumen came from a Zapier estate; Oakhill is moving back to Zapier"
    - "Microsoft Power Automate: the bundled incumbent at BrightPath, Greenline, Harbor Legal and Quarry Ridge, and a possible route for Pinewood's claims triage"
