- id: q03
  question: "What concerns did customers raise about pricing?"
  kind: aggregate
  tags: [example]
  expected_calls: [CALL-001, CALL-003, CALL-005, CALL-006, CALL-010, CALL-019]
  acceptable_calls: [CALL-002, CALL-004, CALL-007, CALL-008, CALL-009, CALL-011, CALL-012, CALL-014, CALL-015]
  expected_facts:
    - "Growth (1,800 a month, up to 30 users, annual) is too expensive for small companies: Cedar & Finch expected 800-1,000, Trafford Dental 200-300, Oakhill left for a plan costing about a tenth"
    - "The cost crosses internal sign-off thresholds: Cedar & Finch's 15,000 limit against 21,600 a year, Fable Media's 20,000 limit (founder approves above), and Acme finance involvement above 25,000"
    - "Fear that occasional approvers or notification-only users will need full seats (Acme, BrightPath, DeltaWorks, Ember, Greenline, Harbor, Inkwell)"
    - "Unpredictable usage and overage costs as volumes grow: Ember's second-year invoice worry, Juniper on per-event pricing and whether subflows count as separate runs, Lumen's actual overages"
    - "Fable Media wanted 10 users instead of 30 or monthly billing; the 30-seat package meant paying for 20 seats it didn't need"
    - "Transparency on professional services and premium connectors (DeltaWorks, Harbor Legal)"
  evidence:
    - "CALL-003 [06:54] / [11:38]-[11:50] 15,000 threshold, 21,600"
    - "CALL-019 [05:43]"
    - "CALL-006 [08:16]-[08:49] ten users / monthly / [09:05] 20,000 limit"
    - "CALL-001 [05:11] / [22:46] approver seats / [24:26] finance above 25,000"
    - "CALL-005 [20:52] overages / [22:49] approver seats"
    - "CALL-010 [06:08] don't pay per event / [08:21]-[09:05] subflow billing"
    - "CALL-004 [19:21] PS and premium connectors; CALL-008 [27:01]"
    - "CALL-011 [02:03] overages in four of last six months; CALL-015 [02:10] a tenth of the cost"
  should_abstain: false
  notes: "Includes existing customers (Lumen overages, Oakhill churn on price). The Growth price is given without a currency. Pounds appear only in CALL-006/014/015/020 for other figures. Don't reward answers that invent a $ sign or quote an Enterprise price; Enterprise is always 'custom'."

