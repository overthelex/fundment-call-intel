    - "CALL-010 [22:41] four-week evaluation / [29:49] Marcus Chen wants to proceed / [21:41]-[21:47] Ava's veto"
    - "CALL-001 [26:17] Rachel Morgan sandbox, three real workflows / [20:58] Workato"
    - "CALL-009 [24:34] Olivia Grant pilot if signal / [30:02] Darren Wu backward analysis / [23:37] late September"
    - "CALL-007 [22:39]; CALL-004 [33:19] / [35:45]; CALL-002 [24:22]; CALL-003 [14:53]; CALL-006 [12:37]"
  should_abstain: false
  notes: "Judgement question, graded by tiers, not by order: the order within a tier is not evaluated (review d09). Any answer naming a single 'will buy' without hedging overclaims: none of the prospects has committed."

