# Gold evaluation set for the OrbitFlow sales-call RAG system.
# Hand-annotated from a full read of all 20 transcripts. Timestamps refer to the
# [MM:SS] markers inside each transcript.
#
# Field notes:
#   expected_calls   - calls a correct answer MUST draw on (retrieval-recall gold).
#   acceptable_calls - relevant but not required; retrieving them is not a false positive.
#   expected_facts   - atomic facts a judge checks for. For aggregate questions a good
#                      answer should cover most (not necessarily all) of them.
#   tags             - optional extra labels: example (verbatim from INSTRUCTIONS.md),
#                      call_type:<renewal|churn|cold|prospect>, ambiguous, near_miss.

# ---------------------------------------------------------------------------
# The 11 example questions from INSTRUCTIONS.md (verbatim)
# ---------------------------------------------------------------------------

- id: q01
  question: "What are the most common reasons prospects hesitate to buy?"
  kind: aggregate
  tags: [example, call_type:prospect]
  expected_calls: [CALL-001, CALL-002, CALL-003, CALL-004, CALL-006, CALL-007, CALL-008, CALL-010]
  acceptable_calls: [CALL-005, CALL-009, CALL-016, CALL-019, CALL-020]
  expected_facts:
    - "Price is high relative to company size or expectations: Cedar & Finch expected 800-1,000 a month against Growth's 1,800, Fable Media called it above budget, Trafford Dental could only consider 200-300 a month, and Acme found it more than expected after anchoring on Zapier"
    - "An existing or already-licensed alternative is the real competitor: expanding Acme's Workato contract, Power Automate bundled with Microsoft agreements (BrightPath, Greenline, Quarry Ridge), MuleSoft at DeltaWorks, keeping Zapier plus better discipline (Cedar & Finch, Fable), or building in-house (Juniper)"
    - "Integration effort or a missing native connector could make the project too heavy: SAP and on-premise systems at DeltaWorks, the first-class Dynamics gap at Greenline, iManage/Intapp at Harbor Legal"
    - "Security or regulatory gates have to clear first: BrightPath's BAA, Harbor Legal's UK residency and ethical walls, DeltaWorks' works council and data residency"
    - "Prospects worry about the licensing and usage model: occasional approvers needing full seats, unpredictable usage overages, and subflow billing at Juniper"
    - "Lack of internal capacity to own or maintain the tool, or doubt that a platform reduces maintenance (Fable has no IT team; at Juniper the staff engineer says a platform brings its own integration maintenance, while the sponsor argues ownership is the real cost; Cedar & Finch could be over-buying)"
  evidence:
    - "CALL-003 [06:54] Sophie Reed (expected 800-1,000) / [13:35] budget is the biggest risk"
    - "CALL-006 [08:06] Imogen Price 'above what I had in mind' / [12:37] price and complexity are the two risks / [11:20] no IT team"
    - "CALL-019 [05:29]-[05:43] Yvonne Deeks: price is the real problem, 200-300 a month"
    - "CALL-001 [05:11] Rachel Morgan Zapier anchor / [20:58] real question is expanding Workato"
    - "CALL-002 [01:01] Elliot Greene BAA is the gate / [11:40] Power Automate covered by Microsoft agreement"
    - "CALL-004 [34:26] Martin Vogel SAP/on-prem too heavy / [05:02] Anika Bose works council"
    - "CALL-007 [13:20] Carlos Mendes first-class Dynamics gap, Power Automate embedded"
    - "CALL-008 [19:23] Samir Khan integration effort disproportionate"
    - "CALL-010 [11:33] Ava Sinclair could build internally / [12:18] Marcus Chen maintenance is the real cost / [12:58] Ava: maintaining the integration to the platform / [08:21] subflow billing"
    - "CALL-005 [20:52] Noah Williams usage overages; CALL-016 [00:51] Dermot Kelly no new software this year"
  should_abstain: false
  notes: "Broad synthesis question. A good answer groups reasons into themes and cites several calls per theme. If it only lists price, it is incomplete: the incumbent/alternative and integration-effort themes are just as common. Weak answers mix in churn reasons (CALL-014/015), which are about customers who already bought, not prospects."

