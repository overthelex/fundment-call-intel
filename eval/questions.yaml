    - "DeltaWorks Manufacturing: Salesforce is in the stack; phase one validates a contract closed in Salesforce against SAP"
    - "Ember Financial: Salesforce is a required integration; failed partner-onboarding events are enriched from Salesforce and Snowflake"
    - "Inkwell Learning: Salesforce account status is one of three signals; reliable for contract dates/ARR/owner but not for human-maintained fields"
    - "Juniper Cloud Tools: Salesforce is in the stack; Salesforce API limits are the constraint they have hit before"
