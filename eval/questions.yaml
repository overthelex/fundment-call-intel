# ---------------------------------------------------------------------------
# Cross-call inference
# ---------------------------------------------------------------------------

- id: q30
  question: "In the Verity Payments post-mortem, Maya says someone reviewed an exported workflow definition 'last month'. Which prospect was that most likely, and what did they ask for?"
  kind: multi_call
  expected_calls: [CALL-014, CALL-010]
  acceptable_calls: [CALL-009]
  expected_facts:
    - "In the Verity call (18 September), Maya says 'Someone did that to us last month' about having an engineer read the exported definition of a real workflow"
    - "The most likely match is Juniper Cloud Tools (call dated 12 August): staff engineer Ava Sinclair asked for three exported definitions (one trivial, one with branching, one with a custom step) to review diffs"
    - "Ava also made 'review the exported definition as though it were a pull request' a pass/fail evaluation criterion"
    - "The transcript never names the prospect, so the attribution is an inference and should be hedged; Inkwell Learning (4 August) is a weaker alternative, since Darren Wu asked about version control and diffs but did not ask to read an exported definition"
  evidence:
    - "CALL-014 [18:11]-[18:39] Sarah Lindqvist / Maya Chen"
    - "CALL-010 [01:28]-[01:48] Ava Sinclair three definitions / [26:28] fourth criterion"
    - "manifest.json dates: CALL-010 2026-08-12, CALL-014 2026-09-18"
  should_abstain: false
  notes: "Multi-hop: needs the call date plus content from another call. A good answer names Juniper with an explicit hedge. Stating it as fact, or failing to find any link, both lose credit. Juniper fits best: Ava asked for three exported definitions to read the diffs herself (exactly Sarah's advice), and its four-week evaluation matches Maya's 'It's ongoing' [18:39]. Inkwell (CALL-009 [27:40]-[28:36]) also falls in 'last month' and Maya attended that call, but nobody there asked to read an export, so it is a weaker candidate."
