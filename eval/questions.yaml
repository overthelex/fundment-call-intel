- id: q08
  question: "Why did customers who left decide to leave?"
  kind: multi_call
  tags: [example, call_type:churn]
  expected_calls: [CALL-014, CALL-015]
  acceptable_calls: [CALL-012]
  expected_facts:
    - "Verity Payments left for Workato mainly because operations never built anything: every production workflow was built by engineering, so they paid a business-user premium for what they used as an engineering tool"
    - "Verity had a connector gap for its European settlement provider that forced custom integration (February). Workato won with a better core-banking connector, a stronger engineering story (recipes as code, CI), and an unbilled three-day custom connector during its PoC"
    - "Verity's enablement was one two-day onboarding (8 attended, 6 never used it again). Sessions offered later in January were declined"
    - "Oakhill Property over-bought: it paid for Growth (1,800 a month, 30 users) but only 4 people logged in (2 builders) for 11 simple workflows"
    - "Oakhill is moving back to Zapier at about 2,000-2,500 a year. The product worked perfectly, but losing approval forms and run history isn't worth about nineteen thousand pounds a year to them"
    - "Oakhill: no smaller plan existed, and nobody noticed the low usage because its segment has no assigned CSM"
  evidence:
    - "CALL-014 [02:52]-[03:21] Kwame Boateng nobody in operations built anything"
    - "CALL-014 [01:33]-[02:09] settlement provider, no connector / [07:37]-[07:49] Workato advantages / [12:35] three days of a solutions architect, not billed"
    - "CALL-014 [04:13] two-day onboarding, eight attended / [04:31] declined sessions"
    - "CALL-015 [01:12]-[01:34] Hazel Wren Growth, four users, two builders, eleven workflows"
    - "CALL-015 [01:53]-[02:14] Zapier, two thousand a year, nineteen thousand pounds"
    - "CALL-015 [06:39] no smaller plan / [08:45] no assigned CSM"
  should_abstain: false
  notes: "Churn-only question. Pinewood (CALL-012) is at risk, not gone. It may be mentioned as a contrast, but presenting it as a churned customer is an error. Trap: Verity's Sarah first names the connector gap, but Kwame explicitly says it 'wasn't why we left. It was the thing we pointed at' [02:41]. A good answer keeps that nuance."

- id: q09
  question: "What is different about how the sales team handles renewals versus new business?"
  kind: multi_call
  tags: [example, call_type:renewal]
  expected_calls: [CALL-011, CALL-012, CALL-013, CALL-001]
  acceptable_calls: [CALL-002, CALL-004, CALL-005, CALL-008, CALL-009, CALL-010, CALL-003]
  expected_facts:
    - "Renewals are led by the CSM (Ruth Adeyemi), with an AE joining only for commercials. New-business calls are run by an AE with a solutions engineer"
    - "Renewals open with usage data from the account (workflow counts, run volume, error rates, dormant seats). New business opens with discovery of pain points, the stack and security requirements"
    - "In renewals the vendor proactively right-sizes against its own revenue: it recommends cutting Lumen from 9 to 7 seats, suggests Pinewood may not need Enterprise or should not renew, and offers a six-month term"
    - "Renewal commercials centre on a standard 7% uplift (Lumen, Halberd), run tiers and contract dates such as Pinewood's 30 September notice deadline. New-business pricing is deliberately not quoted until the builder/approver user model is known"
    - "New business focuses on jointly written pilot success criteria and states that 'don't buy OrbitFlow' is a valid outcome"
  evidence:
    - "CALL-011 [00:15] Maya there for the commercial part / [00:23] usage numbers / [04:40] seven active seats"
    - "CALL-012 [01:58] fourteen workflows, six failing / [06:55] Leo Grant 'not sure you should be' on Enterprise / [08:53] option one don't renew / [12:38] notice deadline"
    - "CALL-013 [00:24] renewal in one sentence, seven percent uplift"
    - "CALL-011 [08:24] seven percent standard uplift"
    - "CALL-001 [22:26] no number without user model / [25:57] 'don't buy OrbitFlow' valid outcome / [26:33] pilot success criteria"
  should_abstain: false
  notes: "Requires contrasting call types. Answers drawn only from renewal calls, with no new-business contrast, are incomplete. Nuance: candour ('I'd rather lose') appears in both motions, so it is not a differentiator. Exception: the 7% uplift is described as applying to everyone, yet Pinewood's six-month option has no uplift (see q11)."

- id: q10
  question: "Which cold calls produced a follow-up, and what did the successful ones have in common?"
  kind: aggregate
  tags: [example, call_type:cold]
  expected_calls: [CALL-016, CALL-017, CALL-018, CALL-019, CALL-020]
  acceptable_calls: []
  expected_facts:
    - "Beacon Housing Trust (CALL-018): a half-hour meeting with Ade Balogun and Priya Menon in the week of the sixth, no demo, frameworks list and technical requirements exchanged"
    - "Silverline Travel (CALL-017): after the assistant put him through, Martine Duval asked for a one-page note (not a deck), copied to Chloe, who will book a meeting if it's good"
    - "Kestrel Robotics (CALL-020): Rafael Santos asked for a short note and will do a 30-minute call if it's good, despite being three weeks into Tray with a mid-October decision"
    - "Quarry Ridge Foods (CALL-016) is only a deferred follow-up (permission for one email in February). Trafford Dental (CALL-019) produced none ('I won't read it')"
