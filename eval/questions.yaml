  notes: "Context matters: 'mentioned' ranges from a price anchor (Zapier at Acme) to an incumbent to a winner (Workato at Verity). Strong answers separate already-owned incumbents from active evaluations from churn destinations. Internal build (Harbor, Juniper, Verity engineers) and 'do nothing better' are also cited as competitors."

- id: q05
  question: "What product capabilities appear to be most important to prospects?"
  kind: aggregate
  tags: [example, call_type:prospect]
  expected_calls: [CALL-001, CALL-002, CALL-004, CALL-005, CALL-007, CALL-008]
  acceptable_calls: [CALL-003, CALL-009, CALL-010, CALL-006]
  expected_facts:
    - "Exception handling beyond the happy path (missing data, API timeouts, approvers who do nothing for two days, state changes mid-run) is raised almost verbatim in several calls"
    - "Exception queues owned by a team or group rather than a named individual, because people change roles"
    - "Run history and audit/run events exportable into the customer's own SIEM or monitoring, not only a vendor console"
    - "Reusable components or subflows that reduce maintenance and spread work across teams or regions"
    - "Version history plus a change-management scenario in the evaluation (build it, change it, break it, roll it back)"
    - "Governance over AI and credentials: AI can be disabled or restricted, customer content is not used for training (in the contract), and connections/secrets are centrally managed and least-privilege"
  evidence:
    - "CALL-001 [09:00] Rachel Morgan; CALL-002 [13:52] Priya Shah; CALL-004 [14:54] Martin Vogel; CALL-007 [04:16] Lucy Hart (happy path not the hard part)"
    - "CALL-001 [09:40]; CALL-002 [14:26]; CALL-004 [16:15]; CALL-007 [11:24]; CALL-005 [19:26] team-owned queues"
    - "CALL-002 [15:10]; CALL-004 [27:33]; CALL-005 [07:30]; CALL-008 [12:22] audit export to SIEM"
    - "CALL-002 [19:14]; CALL-003 [09:20]; CALL-007 [14:06] reusable components"
    - "CALL-001 [19:04]; CALL-004 [23:56]; CALL-005 [19:07] change-management scenario"
    - "CALL-004 [26:00]; CALL-008 [13:55]; CALL-001 [16:03]; CALL-008 [03:22] credential scoping; CALL-010 [03:38]"
  should_abstain: false
  notes: "The near-identical phrasing across calls (happy path, team-owned queue, fifteen times last month) is a dataset feature. A good answer notices the repetition and treats it as evidence of priority. Prospects explicitly deprioritise AI (Acme, DeltaWorks, Harbor, BrightPath want it off or optional), so an answer naming AI as a top capability is wrong."

- id: q06
  question: "What did Acme Corp say about their current workflow?"
  kind: entity_resolution
  tags: [example]
  expected_calls: [CALL-001]
  acceptable_calls: []
  expected_facts:
    - "The answer flags that no 'Acme Corp' exists and maps the question to Acme Logistics (CALL-001)"
    - "Handoffs between sales, onboarding and customer success run on spreadsheets and Slack reminders, so renewal risks and implementation blockers are noticed late (sometimes a week, sometimes at the QBR)"
    - "Not every step is manual; the problem is the gaps between automated pieces, e.g. something runs and then nothing happens for four days"
    - "Workato is used by the data team for a handful of back-office integrations, but RevOps finds it too technical"
    - "Onboarding is described as standardised, but EMEA and North America actually use different milestone definitions"
    - "Ad-hoc automation nobody owns, including scripts (two per Rachel, three per Tom) whose authors are unknown"
  evidence:
    - "CALL-001 [01:51] Rachel Morgan spreadsheets and Slack reminders / [02:12] a week or at the QBR"
    - "CALL-001 [02:23] gaps between automated pieces, four days"
    - "CALL-001 [07:09]-[07:17] Tom Alvarez on Workato"
    - "CALL-001 [05:57] Tom Alvarez EMEA vs North America correction"
    - "CALL-001 [04:00]-[04:27] scripts with unknown authors"
  should_abstain: false
  notes: "Entity-resolution trap. 'Acme Corp' does not appear anywhere. The only Acme is Acme Logistics. The system should answer from CALL-001 but state the name mismatch rather than silently treating them as the same. Answers that refuse outright, or that answer without flagging the mismatch, should lose credit."

