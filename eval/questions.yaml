    - "CALL-005 [00:13] / [29:49] Tray head start"
    - "CALL-020 [00:15] / [00:34] Tray, crossed off"
    - "CALL-003 [02:39] / [12:47] Zapier and Make"
    - "CALL-006 [03:33]; CALL-011 [14:38]-[14:43]; CALL-015 [01:53]"
    - "CALL-002 [11:40]; CALL-007 [06:39] / [13:20]; CALL-008 [21:09]; CALL-012 [04:43]; CALL-016 [01:32] Power Automate"
    - "CALL-004 [10:32] / [34:45] MuleSoft"
