  tags: [example, call_type:prospect, ambiguous]
  expected_calls: [CALL-001, CALL-005, CALL-009, CALL-010]
  acceptable_calls: [CALL-002, CALL-003, CALL-004, CALL-006, CALL-007, CALL-008, CALL-018, CALL-020]
  expected_facts:
    - core: "Ember Financial is in the top tier, with the caveat that Tray has a six-week head start"
      details:
        - "the sponsor wants sandbox access and a six-week pilot proposal"
        - "a remediation programme with a fixed date drives the timeline"
    - core: "Juniper Cloud Tools is in the top tier, with the caveat of an in-house build option and the staff engineer's practical veto"
      details:
        - "a four-week evaluation with a go/no-go decision in September"
        - "the sponsor says he wants to proceed"
    - core: "Acme Logistics is conditional: it depends on whether they expand Workato instead"
      details: ["they will test three real workflows in a sandbox"]
    - core: "Inkwell Learning is conditional: it buys only if the backward analysis shows the signal exists"
