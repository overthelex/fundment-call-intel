[project]
name = "callqa"
version = "0.1.0"
description = "Question answering with evidence over sales-call transcripts"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.7",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "certifi>=2026.10.23",
]

[project.scripts]
callqa = "callqa.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
